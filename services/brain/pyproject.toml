[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-brain"
version = "0.2.0"
description = "Local intent runtime and client for the trusted JARVIS Rust Core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime-genai==0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
jarvis-brain = "jarvis_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "integration: requires the provisioned real ONNX model artifact",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
