[package]
name = "jarvis-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
whisper-rs = { version = "=0.16.0", default-features = false }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
cpal = "=0.18.2"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_Media_Speech", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jarvis-core"
path = "src/main.rs"
